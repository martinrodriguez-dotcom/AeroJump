<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroJump Gualeguaychú - Sistema v2026</title>
    
    <link rel="icon" href="data:,">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Solo utilidades de grilla) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ARCHIVO MAESTRO DE ESTILO -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="custom-scrollbar">

    <!-- 1. VISTA DE ACCESO (LOGIN) -->
    <section id="login-view" class="min-h-screen flex items-center justify-center p-4 bg-black">
        <div class="bento-card w-full max-w-sm text-center">
            <h2 class="title-brand">AeroJump</h2>
            <p class="subtitle-brand">PANEL DE CONTROL</p>
            <form id="login-form" class="space-y-6 mt-8">
                <div class="text-left">
                    <label class="label-tiny">Email de Administrador:</label>
                    <input type="email" id="login-email" required class="input-clean" style="font-size: 1.1rem !important;">
                </div>
                <div class="text-left">
                    <label class="label-tiny">Contraseña:</label>
                    <input type="password" id="login-password" required class="input-clean" style="font-size: 1.1rem !important;">
                </div>
                <button type="submit" class="w-full bg-violet-primary btn-premium">INGRESAR</button>
            </form>
        </div>
    </section>

    <!-- 2. CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
    <div id="app-container" class="is-hidden min-h-screen flex flex-col">
        
        <!-- HEADER -->
        <header class="fixed top-0 left-0 right-0 bg-white z-[50]">
            <div class="flex items-center justify-between px-6 py-4 border-b-2 border-slate-100">
                <div class="flex items-center gap-4">
                    <!-- Botón para abrir el menú lateral -->
                    <button id="menu-btn" onclick="toggleMenu(true)" class="p-2 bg-black text-white rounded-xl active:scale-90 transition-transform">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="leading-none text-left">
                        <h1 class="text-xl font-black uppercase italic">AeroJump</h1>
                        <span class="text-[8px] font-black text-[#7c3aed] uppercase font-mono">Gualeguaychú</span>
                    </div>
                </div>
                <button id="header-sale-btn" onclick="openSaleModal()" class="bg-orange-primary btn-premium btn-small">VENTA KIOSCO</button>
            </div>
        </header>

        <!-- NAVEGACIÓN LATERAL (SIDEBAR) -->
        <nav id="main-menu" class="fixed top-0 left-0 h-screen w-72 bg-white z-[1100] flex flex-col shadow-2xl">
            <div class="p-8 border-b-2 border-slate-50 text-center">
                <p id="user-email-display" class="user-display truncate"></p>
                <button id="logout-btn" class="btn-logout-small mt-2">CERRAR SESIÓN 🔒</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto custom-scrollbar">
                <button class="menu-item" onclick="showView('calendar')" data-view="calendar">🗓️ AGENDA SALTOS</button>
                <button class="menu-item" onclick="showView('productos')" data-view="productos">🥤 STOCK KIOSCO</button>
                <button class="menu-item" onclick="showView('caja')" data-view="caja">💰 ARQUEO CAJA</button>
                <button class="menu-item" onclick="showView('stats')" data-view="stats">📊 RANKINGS</button>
            </div>
        </nav>

        <!-- Overlay para cerrar el menú al hacer clic fuera -->
        <div id="menu-overlay" onclick="toggleMenu(false)" class="fixed inset-0 bg-black/80 z-[1000] hidden"></div>

        <!-- ÁREA DE CONTENIDO -->
        <main class="flex-grow pt-24 pb-12 px-4 max-w-7xl mx-auto w-full overflow-y-auto custom-scrollbar">
            
            <!-- VISTA: CALENDARIO -->
            <div id="calendar-view" class="view-container">
                <div class="bento-card mb-6 flex justify-between items-center bg-white">
                    <button id="prev-month-btn" onclick="prevMonth()" class="btn-nav">◀</button>
                    <h2 id="current-month-year" class="calendar-title"></h2>
                    <button id="next-month-btn" onclick="nextMonth()" class="btn-nav">▶</button>
                </div>
                <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                    <div class="calendar-header-day">Lun</div><div class="calendar-header-day">Mar</div><div class="calendar-header-day">Mie</div><div class="calendar-header-day">Jue</div><div class="calendar-header-day">Vie</div><div class="calendar-header-day">Sab</div><div class="calendar-header-day">Dom</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 md:gap-2"></div>
            </div>

            <!-- VISTA: PRODUCTOS -->
            <div id="productos-view" class="view-container is-hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="section-title">INVENTARIO</h2>
                    <button id="add-product-btn" onclick="toggleProductForm()" class="bg-violet-primary btn-premium btn-small">+ CARGAR</button>
                </div>
                <!-- Formulario de carga de productos oculto -->
                <div id="product-form-container" class="is-hidden bento-card mb-8">
                    <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="prod-name" placeholder="Nombre del Producto" required class="input-clean border-b-2 border-slate-100">
                        <input type="number" id="prod-stock" placeholder="Stock Inicial" required class="input-clean border-b-2 border-slate-100">
                        <div class="flex gap-2">
                            <input type="number" id="prod-batch-cost" placeholder="Costo Bulto" required class="input-clean border-b-2 border-slate-100">
                            <input type="number" id="prod-batch-qty" placeholder="Unidades" required class="input-clean border-b-2 border-slate-100">
                        </div>
                        <input type="hidden" id="prod-profit-pct" value="40">
                        <input type="hidden" id="prod-unit-cost">
                        <div class="flex items-center justify-between p-2">
                            <span class="label-tiny">Sugerido: <strong id="prod-suggested-price">$0</strong></span>
                            <button type="submit" class="bg-green-primary btn-premium btn-small">Guardar</button>
                        </div>
                    </form>
                </div>
                <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- VISTA: CAJA -->
            <div id="caja-view" class="view-container is-hidden">
                <div class="text-center mb-10">
                    <p class="label-tiny">Balance Neto Acumulado</p>
                    <div id="caja-total-combined" class="total-big-display">$0</div>
                </div>
                <div id="caja-daily-list" class="space-y-4 max-w-4xl mx-auto"></div>
            </div>

            <!-- VISTA: RANKINGS -->
            <div id="stats-view" class="view-container is-hidden">
                <h2 class="section-title mb-8">FIDELIDAD CLIENTES</h2>
                <div id="stats-list" class="space-y-4 max-w-3xl mx-auto"></div>
            </div>
        </main>
    </div>

    <!-- 3. MODAL DE RESERVA (COMPACTO) -->
    <div id="booking-modal" class="modal">
        <div class="modal-content modal-booking-compact">
            <div class="modal-header">
                <div class="text-left leading-none">
                    <h3 id="booking-modal-title">GESTIÓN DE TURNO</h3>
                    <span id="booking-type-label" class="badge-type">Salto Normal</span>
                </div>
                <button onclick="closeModals()" class="btn-close-modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="booking-form" class="modal-body space-y-4">
                <input type="hidden" id="booking-id">
                <input type="hidden" id="booking-date">
                <input type="hidden" id="booking-type">

                <div class="bento-inner-card">
                    <label class="label-tiny">Nombre del Responsable</label>
                    <input type="text" id="teamName" required placeholder="Ej: Cumple de Benja" class="input-clean italic">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bento-inner-card text-center">
                        <label class="label-tiny">Personas</label>
                        <div class="flex items-center justify-center gap-3 mt-1">
                            <button type="button" onclick="adjustJumpers(-1)" class="adjust-btn-small">-</button>
                            <input type="number" id="peopleCount" value="1" min="1" max="30" class="input-count">
                            <button type="button" onclick="adjustJumpers(1)" class="adjust-btn-small">+</button>
                        </div>
                    </div>
                    <div class="bento-inner-card text-center">
                        <label class="label-tiny">Costo x Hora ($)</label>
                        <input type="number" id="costPerHour" class="input-money mt-1" oninput="updateBookingTotal()">
                    </div>
                    <div class="bento-inner-card text-center">
                        <label class="label-tiny">Medio de Pago</label>
                        <select id="booking-payment-method" class="select-clean w-full mt-2">
                            <option value="efectivo">Efectivo 💵</option>
                            <option value="mercadopago">M. Pago 📲</option>
                        </select>
                    </div>
                </div>

                <div class="bento-inner-card">
                    <label class="label-tiny mb-3">Horarios Seleccionados (Cupo 30)</label>
                    <div id="court-hours-list" class="grid grid-cols-4 sm:grid-cols-5 gap-2"></div>
                </div>
            </form>

            <div class="modal-footer">
                <div class="text-left leading-none">
                    <span class="label-tiny">Total Cobrado</span>
                    <p id="booking-total" class="booking-total-display">$0</p>
                </div>
                <button type="submit" form="booking-form" class="bg-violet-primary btn-premium">CONFIRMAR TURNO</button>
            </div>
        </div>
    </div>

    <!-- 4. MODAL PUNTO DE VENTA (POS) -->
    <div id="sale-modal" class="modal">
        <div class="modal-content max-w-5xl h-[90vh]">
            <div class="modal-header">
                <h3 class="font-black italic uppercase">Caja Kiosco POS</h3>
                <button onclick="closeModals()" class="btn-close-modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-grow flex flex-col md:flex-row overflow-hidden">
                <div class="flex-grow flex flex-col border-r border-slate-100 overflow-hidden">
                    <div class="p-4 border-b border-slate-50 bg-slate-50/50">
                        <input type="text" id="sale-catalog-filter" oninput="renderSaleCatalog(this.value)" placeholder="🔍 Buscar producto por nombre..." class="input-clean" style="font-size: 1rem !important;">
                    </div>
                    <div id="sale-catalog-list" class="flex-grow overflow-y-auto custom-scrollbar"></div>
                </div>
                <div class="w-full md:w-80 flex flex-col bg-slate-50/30 overflow-hidden">
                    <div class="p-4 border-b border-slate-100"><p class="label-tiny text-center">Resumen de Venta</p></div>
                    <div id="sale-cart-list" class="flex-grow p-4 overflow-y-auto custom-scrollbar">
                        <div id="empty-cart-msg" class="h-full flex items-center justify-center opacity-20 italic uppercase font-black text-center text-xs px-4">El ticket está vacío</div>
                    </div>
                    <div class="p-6 bg-white border-t-2 border-slate-100">
                        <div class="flex justify-between items-center mb-4">
                            <span class="label-tiny font-black">TOTAL A COBRAR:</span>
                            <strong id="sale-total-display" class="text-3xl font-black font-mono italic">$0</strong>
                        </div>
                        <button id="confirm-sale-btn" class="w-full bg-orange-primary btn-premium py-4" disabled onclick="handleConfirmSale()">PROCESAR COBRO</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OVERLAY DE MENSAJES (CARGANDO/EXITO) -->
    <div id="message-overlay" class="modal bg-black/95">
        <div class="flex flex-col items-center justify-center text-center p-12">
            <div class="jumping-child text-5xl mb-6">🚀</div>
            <p id="message-text" class="msg-text text-white text-3xl font-black uppercase italic tracking-widest"></p>
        </div>
    </div>

    <!-- CARGA DE LÓGICA -->
    <script type="module" src="app.js"></script>
</body>
</html>
